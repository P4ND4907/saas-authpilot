name: Paid pilot request
description: Capture a buyer interested in a paid pilot
title: "[Pilot] "
labels: ["sales", "pilot"]
body:
  - type: input
    id: company
    attributes:
      label: Company
      placeholder: Acme Inc.
  - type: input
    id: buyer
    attributes:
      label: Buyer and role
      placeholder: VP Support, CFO, Clinic Operator, etc.
  - type: textarea
    id: pain
    attributes:
      label: Pain and current workflow
      description: What expensive manual workflow should this pilot attack first?
  - type: textarea
    id: systems
    attributes:
      label: Current systems
      description: List the helpdesk, SSO, EHR, accounting, construction, or document systems involved.
